<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">Create Account — Saturn-Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #06070A;
    --bg-2: #0A0C11;
    --card: #12151C;
    --card-2: #181C25;
    --field: #14171F;
    --line: #262B35;
    --line-soft: rgba(255,255,255,0.06);
    --text: #EDEBE4;
    --text-dim: #8B93A4;
    --text-faint: #565E6E;
    --gold: #D4AF37;
    --gold-bright: #F0CB6A;
    --gold-dim: #8C7222;
    --amber: #C98A4B;
    --focus: rgba(212,175,55,0.30);
    --good: #7FAE8C;
    --bad: #C97757;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    overflow-x:hidden;
  }
  h1{ font-family:'Inter',sans-serif; font-weight:600; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  /* ambient starfield */
  body::before{
    content:'';
    position:fixed; inset:0;
    z-index:0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(237,235,228,0.35), transparent),
      radial-gradient(1px 1px at 26% 62%, rgba(237,235,228,0.25), transparent),
      radial-gradient(1.5px 1.5px at 41% 8%, rgba(237,235,228,0.3), transparent),
      radial-gradient(1px 1px at 58% 44%, rgba(237,235,228,0.2), transparent),
      radial-gradient(1px 1px at 73% 76%, rgba(237,235,228,0.3), transparent),
      radial-gradient(1.5px 1.5px at 88% 22%, rgba(237,235,228,0.22), transparent),
      radial-gradient(1px 1px at 95% 58%, rgba(237,235,228,0.28), transparent),
      radial-gradient(1px 1px at 8% 88%, rgba(237,235,228,0.2), transparent),
      radial-gradient(1px 1px at 65% 92%, rgba(237,235,228,0.25), transparent);
    background-repeat:no-repeat;
    pointer-events:none;
  }
  body::after{
    content:'';
    position:fixed; inset:0;
    z-index:0;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(212,175,55,0.07), transparent 70%);
    pointer-events:none;
  }

  .topbar{
    width:100%;
    max-width:1180px;
    padding:26px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:2;
  }
  .logo{ display:flex; align-items:center; gap:11px; font-family:'Inter',sans-serif; font-size:17px; font-weight:600; letter-spacing:-0.01em; color:var(--text); text-decoration:none; }

  /* mini saturn mark */
  .mark{ position:relative; width:20px; height:20px; flex-shrink:0; }
  .mark-body{ position:absolute; inset:4px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 55%, var(--amber) 100%); }
  .mark-ring{ position:absolute; top:50%; left:50%; width:26px; height:9px; border:1.2px solid var(--gold-dim); border-radius:50%; transform:translate(-50%,-50%) rotate(-18deg); }
  .mark-ring.front{ border-color:var(--gold-bright); clip-path:polygon(0 50%, 100% 50%, 100% 100%, 0 100%); z-index:1; }
  .mark-body{ z-index:0; }

  .lang-select{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--text-dim);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:20px;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.04em;
    text-decoration:none;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .lang-select:hover{ border-color:var(--gold-dim); color:var(--text); }

  main{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 20px 60px;
    position:relative;
    z-index:2;
  }

  /* signature: saturn hero */
  .saturn-hero{
    width:132px; height:132px;
    position:relative;
    margin-bottom:8px;
  }
  .saturn-planet{
    position:absolute; inset:26px;
    border-radius:50%;
    background:radial-gradient(circle at 33% 28%, var(--gold-bright) 0%, var(--gold) 48%, var(--amber) 82%, #5E4019 100%);
    box-shadow:
      0 0 46px rgba(212,175,55,0.28),
      inset -9px -9px 18px rgba(0,0,0,0.4),
      inset 4px 4px 10px rgba(255,255,255,0.15);
    z-index:2;
  }
  .saturn-rings{
    position:absolute; inset:0;
    animation:ring-drift 22s ease-in-out infinite;
  }
  .ring{
    position:absolute; top:50%; left:50%;
    border-radius:50%;
    border-style:solid;
    transform:translate(-50%,-50%) rotate(-17deg);
  }
  .ring-back-1{ width:230px; height:78px; border-width:1.5px; border-color:rgba(212,175,55,0.55); z-index:1; }
  .ring-back-2{ width:230px; height:78px; border-width:6px; border-color:rgba(140,114,34,0.28); z-index:1; transform:translate(-50%,-50%) rotate(-17deg) scale(0.92); }
  .ring-front-1{ width:230px; height:78px; border-width:1.5px; border-color:rgba(240,203,106,0.85); z-index:3; clip-path:polygon(0 50%,100% 50%,100% 100%,0 100%); }
  .ring-front-2{ width:230px; height:78px; border-width:6px; border-color:rgba(212,175,55,0.32); z-index:3; transform:translate(-50%,-50%) rotate(-17deg) scale(0.92); clip-path:polygon(0 50%,100% 50%,100% 100%,0 100%); }
  .moon{
    position:absolute; top:50%; left:50%;
    width:4px; height:4px; border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 8px 2px rgba(240,203,106,0.7);
    z-index:4;
    animation:moon-orbit 9s linear infinite;
  }
  @keyframes ring-drift{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(2deg); }
  }
  @keyframes moon-orbit{
    0%{ transform:translate(-50%,-50%) rotate(-17deg) translateX(115px) rotate(17deg) scaleY(1); opacity:0; }
    8%{ opacity:1; }
    50%{ transform:translate(-50%,-50%) rotate(163deg) translateX(115px) rotate(-163deg) scaleY(1); opacity:1; }
    92%{ opacity:1; }
    100%{ transform:translate(-50%,-50%) rotate(343deg) translateX(115px) rotate(-343deg) scaleY(1); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .saturn-rings, .moon{ animation:none; }
  }

  .auth-card{
    width:100%;
    max-width:420px;
    background:linear-gradient(175deg, var(--card-2), var(--card));
    border:1px solid var(--line-soft);
    border-radius:16px;
    padding:40px 34px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,0.6);
  }
  .auth-card h1{
    font-size:27px;
    margin-bottom:8px;
    letter-spacing:-0.01em;
    text-align:center;
  }
  .auth-card .subtitle{
    font-size:14px;
    color:var(--text-dim);
    margin-bottom:30px;
    text-align:center;
    line-height:1.5;
  }
  label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:9px;
  }
  input[type="email"], input[type="text"], input[type="password"]{
    width:100%;
    background:var(--field);
    border:1px solid var(--line);
    border-radius:9px;
    padding:14px 16px;
    color:var(--text);
    font-size:15px;
    font-family:'Inter',sans-serif;
    margin-bottom:18px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{ color:var(--text-faint); }
  input:focus{
    outline:none;
    border-color:var(--gold-dim);
    box-shadow:0 0 0 3px var(--focus);
  }
  input:disabled{ opacity:0.55; }

  .checkbox-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-bottom:22px;
  }
  .checkbox-row input[type="checkbox"]{
    margin-top:3px;
    width:16px;
    height:16px;
    accent-color:var(--gold);
    flex-shrink:0;
  }
  .checkbox-row label{
    margin-bottom:0;
    font-family:'Inter',sans-serif;
    font-size:13px;
    text-transform:none;
    letter-spacing:normal;
    color:var(--text-dim);
    line-height:1.5;
  }
  .checkbox-row a{ color:var(--gold); text-decoration:underline; }

  .verify-box{
    display:flex;
    align-items:center;
    gap:13px;
    background:var(--field);
    border:1px solid var(--line);
    border-radius:9px;
    padding:14px 16px;
    margin-bottom:22px;
    font-size:13px;
    color:var(--text-dim);
  }
  .verify-spinner{
    width:17px;height:17px;
    border-radius:50%;
    border:2px solid var(--line);
    border-top-color:var(--gold);
    animation:spin 0.9s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .verify-label small{ display:block; color:var(--text-faint); font-size:11px; margin-top:2px; }

  .btn-primary{
    width:100%;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#141008;
    border:none;
    padding:15px;
    border-radius:9px;
    font-size:14.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    margin-bottom:26px;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn-primary:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 8px 20px -6px rgba(212,175,55,0.45); }
  .btn-primary:active:not(:disabled){ transform:translateY(0); }
  .btn-primary:disabled{
    background:#2B2A22;
    color:#5C5847;
    cursor:not-allowed;
  }
  .btn-primary:focus-visible, .btn-secondary:focus-visible, input:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:2px;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .divider::before,.divider::after{
    content:''; flex:1; height:1px; background:var(--line);
  }

  .btn-secondary{
    display:block;
    width:100%;
    text-align:center;
    padding:13px;
    border:1px solid var(--line);
    border-radius:9px;
    color:var(--text);
    font-size:14px;
    font-weight:500;
    margin-bottom:14px;
    background:transparent;
    cursor:pointer;
    text-decoration:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn-secondary:hover{ border-color:var(--gold-dim); background:rgba(212,175,55,0.06); }

  footer{
    position:relative;
    z-index:2;
    padding:20px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--text-faint);
    text-align:center;
  }

  @media (max-width:480px){
    .saturn-hero{ width:104px; height:104px; margin-bottom:2px; }
    .auth-card{ padding:32px 24px; border-radius:14px; }
  }

  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:70px; }
  .pw-toggle{ position:absolute; right:12px; top:12px; background:none; border:none; color:var(--text-dim);
    font-size:12px; cursor:pointer; font-family:'Inter',sans-serif; padding:4px 6px; }
  .pw-toggle:hover{ color:var(--gold-bright); }
  .hint-small{ font-size:11.5px; color:var(--text-faint); margin:-10px 0 16px; line-height:1.45; }
  .link-row{ text-align:center; margin:-8px 0 20px; }
  .link-btn{ background:none; border:none; color:var(--gold-bright); cursor:pointer; font-family:'Inter',sans-serif; font-size:13px; text-decoration:underline; text-underline-offset:3px; }
  .ok-msg{ color:var(--good); font-size:13px; margin:-6px 0 16px; display:none; line-height:1.45; }
</style>
<script src="saturnpay-config.js"></script>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">
    <span class="mark"><span class="mark-ring"></span><span class="mark-body"></span><span class="mark-ring front"></span></span>
    Saturn-Pay
  </a>
  <a href="settings.html" class="lang-select" id="langIndicator">EN ▾</a>
</div>

<main>
  <div class="saturn-hero" aria-hidden="true">
    <div class="saturn-rings">
      <div class="ring ring-back-2"></div>
      <div class="ring ring-back-1"></div>
    </div>
    <div class="saturn-planet"></div>
    <div class="saturn-rings">
      <div class="ring ring-front-2"></div>
      <div class="ring ring-front-1"></div>
    </div>
    <div class="moon"></div>
  </div>

  <div class="auth-card">
    <h1 data-i18n="register_title">Create account</h1>
    <p class="subtitle" data-i18n="register_subtitle">Set up your account with a few details.</p>

    <form id="registerForm">
      <label for="name" id="nameLabel" data-i18n="label_name">Full Name</label>
      <input type="text" id="name" data-i18n-placeholder="placeholder_name" autocomplete="name" required>

      <label for="email" id="emailLabel" data-i18n="label_email">Email</label>
      <input type="email" id="email" data-i18n-placeholder="placeholder_email" autocomplete="email" required>

      <div id="pwBlock">
        <label for="password" data-i18n="label_password">label_password</label>
      <div class="pw-wrap">
        <input type="password" id="password" data-i18n-placeholder="placeholder_password" autocomplete="new-password">
        <button type="button" class="pw-toggle" data-target="password"></button>
      </div>
        <label for="password2" data-i18n="label_password_confirm">label_password_confirm</label>
      <div class="pw-wrap">
        <input type="password" id="password2" data-i18n-placeholder="placeholder_password_confirm" autocomplete="new-password">
        <button type="button" class="pw-toggle" data-target="password2"></button>
      </div>
        <p class="hint-small" data-i18n="hint_password">At least 8 characters.</p>
      </div>

      <div id="codeGroup" style="display:none;">
        <label for="code" data-i18n="label_code">Verification Code</label>
        <input type="text" id="code" data-i18n-placeholder="placeholder_code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" style="margin-bottom:18px;">
      </div>

      <div class="checkbox-row" id="termsRow">
        <input type="checkbox" id="terms">
        <label for="terms"><span data-i18n="terms_before">I have read and accept the </span><a href="terms.html" target="_blank" data-i18n="terms_link">Terms of Use</a><span data-i18n="terms_after">.</span></label>
      </div>

      <div class="verify-box" id="verifyBox" role="status" aria-live="polite">
        <div class="verify-spinner"></div>
        <div class="verify-label">
          <span data-i18n="verifying_text">Verifying…</span>
          <small data-i18n="verifying_sub">Automatic traffic check</small>
        </div>
      </div>

      <p id="formError" style="color:#C97757;font-size:13px;margin:-6px 0 16px;display:none;"></p>

      <button type="submit" class="btn-primary" id="submitBtn" disabled data-i18n="btn_create_account">Create Account</button>
    </form>

    <div class="divider" data-i18n="divider_or">or</div>

    <a href="login.html" class="btn-secondary" data-i18n="btn_have_account">I already have an account</a>
  </div>
</main>

<footer data-i18n="footer_copyright">© 2026 SATURN-PAY · ALL RIGHTS RESERVED</footer>

  function getLang() { const c = localStorage.getItem(LANG_KEY) || 'en'; return translations[c] ? c : 'en'; }
  function t(key) { return (translations[getLang()] || translations.en)[key]; }
  function applyLang() {
    const code = getLang();
    const dict = translations[code] || translations.en;
    document.documentElement.lang = code;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (dict[key] !== undefined) el.placeholder = dict[key];
    });
    document.getElementById('pageTitleTag').textContent = `${dict.register_title} — Saturn-Pay`;
    document.getElementById('langIndicator').textContent = code.toUpperCase() + ' ▾';
  }

  // ── Password helpers ────────────────────────────────────────────────
  // NOTE: In test mode the "database" lives in this browser only. A real
  // backend must hash passwords (bcrypt/argon2) on the server and never
  // store or log them in plain text.
  function randSalt() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
  async function hashPw(pw, salt) {
    const data = salt + ':' + pw;
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    let h = 5381; for (let i = 0; i < data.length; i++) h = ((h << 5) + h + data.charCodeAt(i)) | 0;
    return 'x' + (h >>> 0).toString(16);
  }
  function checkPassword(pw, email) {
    if (pw.length < 8) return t('err_password_short');
    if (pw.toLowerCase() === String(email).trim().toLowerCase()) return t('err_password_same_email');
    return null;
  }
  function wirePwToggles() {
    document.querySelectorAll('.pw-toggle').forEach(btn => {
      const input = document.getElementById(btn.dataset.target);
      const refresh = () => { btn.textContent = t(input.type === 'password' ? 'show_pw' : 'hide_pw'); };
      btn.addEventListener('click', () => { input.type = input.type === 'password' ? 'text' : 'password'; refresh(); });
      refresh();
    });
  }

  // ── Auth ────────────────────────────────────────────────────────────
  // Real backend contract (all POST, JSON):
  //   /request-code { email, name, password, termsAccepted } -> { sent: true }
  //       (server validates, stores a HASH of the password as pending, emails a code)
  //   /verify-code  { email, code }                          -> { token, user }
  //       (activates the account with the pending password)
  const API_BASE = (window.SP && SP.live) ? SP.API + "/api/auth" : "http://localhost:3000/api/auth";

  // TEST MODE: simulates the backend in this browser. Set to false once a
  // real backend is deployed and API_BASE points to it.
  const MOCK_MODE = !(window.SP && SP.live);
  const MOCK_DELAY = 550;

  function mockDb() { try { return JSON.parse(localStorage.getItem('saturnpay_mock_users') || '{}'); } catch (e) { return {}; } }
  function saveMockDb(db) { localStorage.setItem('saturnpay_mock_users', JSON.stringify(db)); }
  function mockCode() { return String(Math.floor(100000 + Math.random() * 900000)); }
  function mockId() { return 'usr_' + Math.random().toString(36).slice(2, 10); }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function showMockCode(code) {
    let hint = document.getElementById('mockCodeHint');
    if (!hint) {
      hint = document.createElement('p');
      hint.id = 'mockCodeHint';
      hint.style.cssText = 'margin:-6px 0 16px;padding:10px 14px;border:1px dashed var(--gold-dim);border-radius:8px;font-family:\'IBM Plex Mono\',monospace;font-size:12.5px;color:var(--gold-bright);';
      codeGroup.appendChild(hint);
    }
    hint.textContent = `${t('test_mode_prefix')} ${code}`;
  }

  async function mockApi(action, p) {
    await wait(MOCK_DELAY);
    const db = mockDb();
    const email = String(p.email || '').trim().toLowerCase();
    if (action === 'request-code') {
      if (db[email] && db[email].verified) return { ok: false, data: { error: t('err_exists') } };
      const code = mockCode();
      const salt = randSalt();
      db[email] = { name: p.name, email, id: (db[email] && db[email].id) || mockId(), code, verified: false, salt, pwHash: await hashPw(p.password, salt) };
      saveMockDb(db);
      showMockCode(code);
      return { ok: true, data: { sent: true } };
    }
    if (action === 'verify-code') {
      const rec = db[email];
      if (!rec || !rec.code || rec.code !== p.code) return { ok: false, data: { error: t('err_code_invalid') } };
      rec.verified = true; rec.code = null; saveMockDb(db);
      return { ok: true, data: { token: 'mock_' + Math.random().toString(36).slice(2, 14), user: { id: rec.id, name: rec.name, email: rec.email } } };
    }
    return { ok: false, data: { error: t('err_connection') } };
  }

  async function callAuthApi(action, payload) {
    if (MOCK_MODE) return mockApi(action, payload);
    const res = await fetch(`${API_BASE}/${action}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    return { ok: res.ok, data };
  }

  const $ = id => document.getElementById(id);
  const form = $('registerForm'), nameInput = $('name'), emailInput = $('email');
  const passwordInput = $('password'), password2Input = $('password2'), pwBlock = $('pwBlock');
  const codeGroup = $('codeGroup'), codeInput = $('code'), termsRow = $('termsRow'), termsCheckbox = $('terms');
  const submitBtn = $('submitBtn'), errorEl = $('formError'), verifyBox = $('verifyBox');
  let step = 'details';

  setTimeout(() => {
    verifyBox.innerHTML = `<div style="color:#7FAE8C;font-size:16px;">✓</div><div class="verify-label">${t('verified_text')}</div>`;
    submitBtn.disabled = false;
  }, 1400);

  function showError(m) { errorEl.textContent = m; errorEl.style.display = 'block'; }
  function clearError() { errorEl.style.display = 'none'; }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearError();

    if (step === 'details') {
      const problem = checkPassword(passwordInput.value, emailInput.value);
      if (problem) { showError(problem); return; }
      if (passwordInput.value !== password2Input.value) { showError(t('err_password_mismatch')); return; }
      if (!termsCheckbox.checked) { showError(t('err_terms')); return; }
    }

    submitBtn.disabled = true;
    try {
      if (step === 'details') {
        const { ok, data } = await callAuthApi('request-code', {
          email: emailInput.value, name: nameInput.value, password: passwordInput.value, termsAccepted: termsCheckbox.checked,
        });
        if (!ok) { showError(data.error || t('err_code_send_failed')); return; }
        step = 'code';
        nameInput.disabled = true; emailInput.disabled = true;
        pwBlock.style.display = 'none'; termsRow.style.display = 'none';
        codeGroup.style.display = 'block';
        submitBtn.textContent = t('btn_verify_code');
        codeInput.focus();
      } else {
        const { ok, data } = await callAuthApi('verify-code', { email: emailInput.value, code: codeInput.value });
        if (!ok) { showError(data.error || t('err_code_verify_failed')); return; }
        localStorage.setItem('saturnpay_token', data.token);
        localStorage.setItem('saturnpay_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      }
    } catch (err) {
      showError(t('err_connection'));
    } finally {
      submitBtn.disabled = false;
    }
  });

  applyLang();
  wirePwToggles();
</script>
