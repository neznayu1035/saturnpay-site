<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">Welcome — Saturn-Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #06070A;
    --bg-2: #0A0C11;
    --card: #12151C;
    --card-2: #181C25;
    --field: #14171F;
    --line: #262B35;
    --line-soft: rgba(255,255,255,0.06);
    --text: #EDEBE4;
    --text-dim: #8B93A4;
    --text-faint: #565E6E;
    --gold: #D4AF37;
    --gold-bright: #F0CB6A;
    --gold-dim: #8C7222;
    --amber: #C98A4B;
    --focus: rgba(212,175,55,0.30);
    --good: #7FAE8C;
    --bad: #C97757;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    overflow-x:hidden;
  }
  h1{ font-family:'Inter',sans-serif; font-weight:600; }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  /* ambient starfield */
  body::before{
    content:'';
    position:fixed; inset:0;
    z-index:0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(237,235,228,0.35), transparent),
      radial-gradient(1px 1px at 26% 62%, rgba(237,235,228,0.25), transparent),
      radial-gradient(1.5px 1.5px at 41% 8%, rgba(237,235,228,0.3), transparent),
      radial-gradient(1px 1px at 58% 44%, rgba(237,235,228,0.2), transparent),
      radial-gradient(1px 1px at 73% 76%, rgba(237,235,228,0.3), transparent),
      radial-gradient(1.5px 1.5px at 88% 22%, rgba(237,235,228,0.22), transparent),
      radial-gradient(1px 1px at 95% 58%, rgba(237,235,228,0.28), transparent),
      radial-gradient(1px 1px at 8% 88%, rgba(237,235,228,0.2), transparent),
      radial-gradient(1px 1px at 65% 92%, rgba(237,235,228,0.25), transparent);
    background-repeat:no-repeat;
    pointer-events:none;
  }
  body::after{
    content:'';
    position:fixed; inset:0;
    z-index:0;
    background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(212,175,55,0.07), transparent 70%);
    pointer-events:none;
  }

  .topbar{
    width:100%;
    max-width:1180px;
    padding:26px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:2;
  }
  .logo{ display:flex; align-items:center; gap:11px; font-family:'Inter',sans-serif; font-size:17px; font-weight:600; letter-spacing:-0.01em; color:var(--text); text-decoration:none; }

  .mark{ position:relative; width:20px; height:20px; flex-shrink:0; }
  .mark-body{ position:absolute; inset:4px; border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 55%, var(--amber) 100%); }
  .mark-ring{ position:absolute; top:50%; left:50%; width:26px; height:9px; border:1.2px solid var(--gold-dim); border-radius:50%; transform:translate(-50%,-50%) rotate(-18deg); }
  .mark-ring.front{ border-color:var(--gold-bright); clip-path:polygon(0 50%, 100% 50%, 100% 100%, 0 100%); z-index:1; }
  .mark-body{ z-index:0; }

  .lang-select{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:var(--text-dim);
    border:1px solid var(--line);
    padding:8px 14px;
    border-radius:20px;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:0.04em;
    text-decoration:none;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .lang-select:hover{ border-color:var(--gold-dim); color:var(--text); }

  main{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 20px 60px;
    position:relative;
    z-index:2;
  }

  /* saturn hero */
  .saturn-hero{
    width:132px; height:132px;
    position:relative;
    margin-bottom:8px;
  }
  .saturn-planet{
    position:absolute; inset:26px;
    border-radius:50%;
    background:radial-gradient(circle at 33% 28%, var(--gold-bright) 0%, var(--gold) 48%, var(--amber) 82%, #5E4019 100%);
    box-shadow:
      0 0 46px rgba(212,175,55,0.28),
      inset -9px -9px 18px rgba(0,0,0,0.4),
      inset 4px 4px 10px rgba(255,255,255,0.15);
    z-index:2;
  }
  .saturn-rings{
    position:absolute; inset:0;
    animation:ring-drift 22s ease-in-out infinite;
  }
  .ring{
    position:absolute; top:50%; left:50%;
    border-radius:50%;
    border-style:solid;
    transform:translate(-50%,-50%) rotate(-17deg);
  }
  .ring-back-1{ width:230px; height:78px; border-width:1.5px; border-color:rgba(212,175,55,0.55); z-index:1; }
  .ring-back-2{ width:230px; height:78px; border-width:6px; border-color:rgba(140,114,34,0.28); z-index:1; transform:translate(-50%,-50%) rotate(-17deg) scale(0.92); }
  .ring-front-1{ width:230px; height:78px; border-width:1.5px; border-color:rgba(240,203,106,0.85); z-index:3; clip-path:polygon(0 50%,100% 50%,100% 100%,0 100%); }
  .ring-front-2{ width:230px; height:78px; border-width:6px; border-color:rgba(212,175,55,0.32); z-index:3; transform:translate(-50%,-50%) rotate(-17deg) scale(0.92); clip-path:polygon(0 50%,100% 50%,100% 100%,0 100%); }
  .moon{
    position:absolute; top:50%; left:50%;
    width:4px; height:4px; border-radius:50%;
    background:var(--gold-bright);
    box-shadow:0 0 8px 2px rgba(240,203,106,0.7);
    z-index:4;
    animation:moon-orbit 9s linear infinite;
  }
  @keyframes ring-drift{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(2deg); }
  }
  @keyframes moon-orbit{
    0%{ transform:translate(-50%,-50%) rotate(-17deg) translateX(115px) rotate(17deg) scaleY(1); opacity:0; }
    8%{ opacity:1; }
    50%{ transform:translate(-50%,-50%) rotate(163deg) translateX(115px) rotate(-163deg) scaleY(1); opacity:1; }
    92%{ opacity:1; }
    100%{ transform:translate(-50%,-50%) rotate(343deg) translateX(115px) rotate(-343deg) scaleY(1); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .saturn-rings, .moon{ animation:none; }
  }

  .auth-card{
    width:100%;
    max-width:420px;
    background:linear-gradient(175deg, var(--card-2), var(--card));
    border:1px solid var(--line-soft);
    border-radius:16px;
    padding:40px 34px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,0.6);
  }
  .auth-card h1{
    font-size:27px;
    margin-bottom:8px;
    letter-spacing:-0.01em;
    text-align:center;
  }
  .auth-card .subtitle{
    font-size:14px;
    color:var(--text-dim);
    margin-bottom:30px;
    text-align:center;
    line-height:1.5;
  }
  label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--text-dim);
    margin-bottom:9px;
  }
  input[type="email"], input[type="text"]{
    width:100%;
    background:var(--field);
    border:1px solid var(--line);
    border-radius:9px;
    padding:14px 16px;
    color:var(--text);
    font-size:15px;
    font-family:'Inter',sans-serif;
    margin-bottom:18px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{ color:var(--text-faint); }
  input:focus{
    outline:none;
    border-color:var(--gold-dim);
    box-shadow:0 0 0 3px var(--focus);
  }
  input:disabled{ opacity:0.55; }

  .verify-box{
    display:flex;
    align-items:center;
    gap:13px;
    background:var(--field);
    border:1px solid var(--line);
    border-radius:9px;
    padding:14px 16px;
    margin-bottom:22px;
    font-size:13px;
    color:var(--text-dim);
  }
  .verify-spinner{
    width:17px;height:17px;
    border-radius:50%;
    border:2px solid var(--line);
    border-top-color:var(--gold);
    animation:spin 0.9s linear infinite;
    flex-shrink:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .verify-label small{ display:block; color:var(--text-faint); font-size:11px; margin-top:2px; }

  .btn-primary{
    width:100%;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:#141008;
    border:none;
    padding:15px;
    border-radius:9px;
    font-size:14.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    margin-bottom:26px;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn-primary:hover:not(:disabled){ transform:translateY(-1px); box-shadow:0 8px 20px -6px rgba(212,175,55,0.45); }
  .btn-primary:active:not(:disabled){ transform:translateY(0); }
  .btn-primary:disabled{
    background:#2B2A22;
    color:#5C5847;
    cursor:not-allowed;
  }
  .btn-primary:focus-visible, .btn-secondary:focus-visible, input:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:2px;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:14px;
    color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .divider::before,.divider::after{
    content:''; flex:1; height:1px; background:var(--line);
  }

  .btn-secondary{
    display:block;
    width:100%;
    text-align:center;
    padding:13px;
    border:1px solid var(--line);
    border-radius:9px;
    color:var(--text);
    font-size:14px;
    font-weight:500;
    margin-bottom:14px;
    background:transparent;
    cursor:pointer;
    text-decoration:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn-secondary:hover{ border-color:var(--gold-dim); background:rgba(212,175,55,0.06); }

  .support-link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:13px;
    border:1px solid var(--line);
    border-radius:9px;
    color:var(--text-dim);
    font-size:14px;
    font-family:'Inter',sans-serif;
    background:transparent;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .support-link:hover{ border-color:var(--gold-dim); color:var(--text); }

  footer{
    position:relative;
    z-index:2;
    padding:20px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--text-faint);
    text-align:center;
  }

  .doc-card{ max-width:720px; }
  .doc-card h1{ text-align:center; }
  .doc-card h2{ font-size:15px; font-weight:600; color:var(--gold-bright); margin:26px 0 8px; }
  .doc-card p{ font-size:14px; line-height:1.65; color:var(--text-dim); }
  .doc-card .updated{ text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); margin-bottom:8px; }
  .doc-card .back{ margin-top:30px; }
  .hero-actions{ display:flex; flex-direction:column; gap:12px; }
  .hero-actions .btn-primary{ display:block; text-align:center; text-decoration:none; margin-bottom:0; }
  .hero-actions .btn-secondary{ margin-bottom:0; }
  .links-row{ display:flex; justify-content:center; gap:18px; margin-top:22px; font-size:13px; }
  .links-row a{ color:var(--text-dim); text-decoration:none; }
  .links-row a:hover{ color:var(--gold-bright); }
  @media (max-width:480px){
    .saturn-hero{ width:104px; height:104px; margin-bottom:2px; }
    .auth-card{ padding:32px 24px; border-radius:14px; }
  }
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0B0D12">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">
    <span class="mark"><span class="mark-ring"></span><span class="mark-body"></span><span class="mark-ring front"></span></span>
    Saturn-Pay
  </a>
  <a href="settings.html" class="lang-select" id="langIndicator">EN ▾</a>
</div>

<main>
  <div class="saturn-hero" aria-hidden="true">
    <div class="saturn-rings">
      <div class="ring ring-back-2"></div>
      <div class="ring ring-back-1"></div>
    </div>
    <div class="saturn-planet"></div>
    <div class="saturn-rings">
      <div class="ring ring-front-2"></div>
      <div class="ring ring-front-1"></div>
    </div>
    <div class="moon"></div>
  </div>

  <div class="auth-card">
    <h1 data-i18n="home_title">Welcome to Saturn-Pay</h1>
    <p class="subtitle" data-i18n="home_subtitle">Deposit USDT, track your investments and grow your balance in one place.</p>
    <div class="hero-actions">
      <a href="login.html" class="btn-primary" data-i18n="btn_login">Log In</a>
      <a href="register.html" class="btn-secondary" data-i18n="btn_create_account">Create Account</a>
    </div>
    <div class="links-row"><a href="terms.html" data-i18n="terms_link">Terms of Use</a></div>
  </div>
</main>

<footer data-i18n="footer_copyright">© 2026 SATURN-PAY · ALL RIGHTS RESERVED</footer>

<script>
  // Already signed in? Go straight to the dashboard.
  try { if (localStorage.getItem('saturnpay_token')) window.location.replace('dashboard.html'); } catch (e) {}

  const LANG_KEY = 'saturnpay_lang';
  const LOCALE_MAP = { en: 'en-US', tr: 'tr-TR', ru: 'ru-RU', es: 'es-ES', fr: 'fr-FR', de: 'de-DE' };

  const translations = {
    en: {
      home_title: 'Welcome to Saturn-Pay',
      home_subtitle: 'Deposit USDT, track your investments and grow your balance in one place.',
      btn_login: 'Log In',
      btn_create_account: 'Create Account',
      terms_link: 'Terms of Use',
      footer_copyright: '© 2026 SATURN-PAY · ALL RIGHTS RESERVED',
    },
    tr: {
      home_title: 'Saturn-Pay\'e hoş geldiniz',
      home_subtitle: 'USDT yatırın, yatırımlarınızı takip edin ve bakiyenizi tek yerden büyütün.',
      btn_login: 'Giriş Yap',
      btn_create_account: 'Hesap Oluştur',
      terms_link: 'Kullanım Koşulları',
      footer_copyright: '© 2026 SATURN-PAY · TÜM HAKLARI SAKLIDIR',
    },
    ru: {
      home_title: 'Добро пожаловать в Saturn-Pay',
      home_subtitle: 'Пополняйте баланс в USDT, следите за инвестициями и приумножайте средства в одном месте.',
      btn_login: 'Войти',
      btn_create_account: 'Создать аккаунт',
      terms_link: 'Условия использования',
      footer_copyright: '© 2026 SATURN-PAY · ВСЕ ПРАВА ЗАЩИЩЕНЫ',
    },
    es: {
      home_title: 'Bienvenido a Saturn-Pay',
      home_subtitle: 'Deposita USDT, sigue tus inversiones y haz crecer tu saldo en un solo lugar.',
      btn_login: 'Iniciar sesión',
      btn_create_account: 'Crear cuenta',
      terms_link: 'Términos de uso',
      footer_copyright: '© 2026 SATURN-PAY · TODOS LOS DERECHOS RESERVADOS',
    },
    fr: {
      home_title: 'Bienvenue sur Saturn-Pay',
      home_subtitle: 'Déposez des USDT, suivez vos investissements et faites fructifier votre solde au même endroit.',
      btn_login: 'Connexion',
      btn_create_account: 'Créer un compte',
      terms_link: 'Conditions d\'utilisation',
      footer_copyright: '© 2026 SATURN-PAY · TOUS DROITS RÉSERVÉS',
    },
    de: {
      home_title: 'Willkommen bei Saturn-Pay',
      home_subtitle: 'Zahle USDT ein, verfolge deine Investitionen und vergrößere dein Guthaben an einem Ort.',
      btn_login: 'Anmelden',
      btn_create_account: 'Konto erstellen',
      terms_link: 'Nutzungsbedingungen',
      footer_copyright: '© 2026 SATURN-PAY · ALLE RECHTE VORBEHALTEN',
    },
  };

  function getLang() {
    const code = localStorage.getItem(LANG_KEY) || 'en';
    return translations[code] ? code : 'en';
  }
  function t(key) {
    return (translations[getLang()] || translations.en)[key];
  }
  function applyLang() {
    const code = getLang();
    const dict = translations[code] || translations.en;
    document.documentElement.lang = code;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    document.getElementById('pageTitleTag').textContent = `${dict.home_title} — Saturn-Pay`;
    document.getElementById('langIndicator').textContent = code.toUpperCase() + ' ▾';
  }

  applyLang();
</script>

</body>
</html>
