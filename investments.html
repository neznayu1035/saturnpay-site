<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">Saturn-Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #06070A; --card: #12151C; --card-2: #181C25; --field: #14171F;
    --line: #262B35; --line-soft: rgba(255,255,255,0.06);
    --text: #EDEBE4; --text-dim: #8B93A4; --text-faint: #565E6E;
    --gold: #D4AF37; --gold-bright: #F0CB6A; --gold-dim: #8C7222; --amber: #C98A4B;
    --good: #7FAE8C; --bad: #C97757;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;}
  body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; padding-bottom:78px; }
  h1,h2{ font-family:'Inter',sans-serif; font-weight:500; }
  a{ color:inherit; text-decoration:none; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 6px; max-width:520px; margin:0 auto;
  }
  .avatar-btn{
    width:38px; height:38px; border-radius:50%;
    background:linear-gradient(160deg, var(--card-2), var(--card));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--text-dim);
  }
  .avatar-btn svg{ width:17px; height:17px; }
  .avatar-btn:hover{ border-color:var(--gold-dim); }
  .brand-mini{ font-size:15px; font-weight:600; color:var(--text-dim); letter-spacing:0.02em; }
  .bell-btn{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); background:transparent; border:none; cursor:pointer; position:relative;
  }
  .bell-btn svg{ width:19px; height:19px; }
  .bell-dot{
    position:absolute; top:7px; right:8px; width:7px; height:7px; border-radius:50%;
    background:var(--gold-bright); box-shadow:0 0 6px rgba(240,203,106,0.7);
  }

  main{ max-width:520px; margin:0 auto; padding:14px 20px 40px; }

  .page-head{ padding:8px 0 4px; }
  .page-head h1{ font-size:21px; margin-bottom:4px; }
  .page-head p{ color:var(--text-dim); font-size:13px; }

  .summary-row{ display:flex; gap:24px; padding:18px 2px 20px; }
  .summary-stat .n{ font-size:22px; font-weight:500; color:var(--text); }
  .summary-stat .l{ font-size:11px; color:var(--text-faint); margin-top:3px; }

  .invest-card{
    background:linear-gradient(175deg, var(--card-2), var(--card));
    border:1px solid var(--line-soft);
    border-radius:14px;
    padding:6px 20px;
  }
  .invest-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:15px 0; border-top:1px solid var(--line-soft); gap:12px;
  }
  .invest-row:first-child{ border-top:none; }
  .invest-main{ display:flex; align-items:center; gap:12px; min-width:0; }
  .invest-badge{
    width:34px; height:34px; border-radius:50%;
    background:rgba(212,175,55,0.12); color:var(--gold-bright);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; flex-shrink:0;
  }
  .invest-desc{ font-size:14px; color:var(--text); }
  .invest-date{ font-size:11.5px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; margin-top:2px; }
  .invest-right{ text-align:right; flex-shrink:0; }
  .invest-amount{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; color:var(--good); }
  .invest-status{
    display:inline-block; margin-top:4px;
    padding:2px 9px; border-radius:999px;
    background:rgba(127,174,140,0.12); border:1px solid rgba(127,174,140,0.3);
    color:var(--good); font-size:10px; font-family:'IBM Plex Mono',monospace;
  }
  .empty-note{ color:var(--text-dim); font-size:13px; text-align:center; padding:30px 0; }

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    background:rgba(10,12,17,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line-soft); display:flex;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:11px 4px 9px; color:var(--text-faint); font-size:10.5px; cursor:pointer;
    transition:color .15s ease;
  }
  .nav-item .icon svg{ width:21px; height:21px; display:block; }
  .nav-item:hover{ color:var(--text-dim); }
  .nav-item.active{ color:var(--gold-bright); }

  .balance-strip{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:linear-gradient(175deg, var(--card-2), var(--card)); border:1px solid var(--line-soft);
    border-radius:14px; padding:14px 18px; margin-bottom:14px; }
  .balance-strip .l{ font-size:11.5px; color:var(--text-dim); }
  .balance-strip .v{ font-family:'IBM Plex Mono',monospace; font-size:18px; color:var(--gold-bright); margin-top:2px; }
  .link-pill{ font-size:12.5px; color:var(--gold-bright); border:1px solid var(--gold-dim); border-radius:999px; padding:7px 14px; }
  .note{ font-size:11.5px; color:var(--text-faint); line-height:1.5; margin:4px 2px 14px; }
  .plan-card{ background:linear-gradient(175deg, var(--card-2), var(--card)); border:1px solid var(--line-soft);
    border-radius:14px; padding:18px 18px 16px; margin-bottom:12px; }
  .plan-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .plan-name{ font-size:17px; font-weight:600; }
  .plan-badge{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--good);
    background:rgba(127,174,140,0.12); border:1px solid rgba(127,174,140,0.3); border-radius:999px; padding:3px 10px; }
  .plan-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .plan-stats .k{ font-size:11px; color:var(--text-dim); margin-bottom:3px; }
  .plan-stats .v{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; color:var(--text); }
  .btn-gold{ width:100%; border:none; border-radius:9px; padding:13px; font-size:14px; font-weight:600;
    font-family:'Inter',sans-serif; cursor:pointer; color:#141008;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold)); }
  .btn-gold:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{ width:100%; border:1px solid var(--line); border-radius:9px; padding:12px; font-size:14px;
    font-family:'Inter',sans-serif; cursor:pointer; color:var(--text); background:transparent; margin-top:10px; display:block; text-align:center; }
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.62); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .overlay.open{ display:flex; }
  .sheet{ width:100%; max-width:520px; background:var(--card); border:1px solid var(--line-soft);
    border-radius:18px 18px 0 0; padding:22px 20px 26px; }
  .sheet h2{ font-size:18px; margin-bottom:14px; }
  .sheet label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:7px; }
  .sheet input{ width:100%; background:var(--field); border:1px solid var(--line); border-radius:9px; padding:13px 14px;
    color:var(--text); font-size:16px; font-family:'IBM Plex Mono',monospace; }
  .sheet input:focus{ outline:none; border-color:var(--gold-dim); }
  .hint{ font-size:11.5px; color:var(--text-faint); margin:7px 0 14px; }
  .preview{ border-top:1px solid var(--line-soft); padding-top:10px; margin-bottom:14px; }
  .preview .r{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--text-dim); }
  .preview .r b{ font-family:'IBM Plex Mono',monospace; font-weight:500; color:var(--text); }
  .err{ color:var(--bad); font-size:12.5px; min-height:18px; margin-bottom:8px; }
  .ok-box{ text-align:center; padding:10px 0 4px; }
  .ok-box .tick{ font-size:30px; color:var(--good); }
  .ok-box p{ margin:8px 0 16px; font-size:15px; }
  .inv-card{ background:linear-gradient(175deg, var(--card-2), var(--card)); border:1px solid var(--line-soft);
    border-radius:14px; padding:16px 18px; margin-bottom:12px; }
  .inv-top{ display:flex; align-items:center; gap:16px; }
  .ring{ position:relative; width:68px; height:68px; flex-shrink:0; }
  .ring svg{ width:68px; height:68px; transform:rotate(-90deg); }
  .ring .pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--gold-bright); }
  .inv-info{ flex:1; min-width:0; }
  .inv-name{ font-size:15.5px; font-weight:600; }
  .inv-meta{ font-size:12px; color:var(--text-dim); margin-top:3px; }
  .left-big{ font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--text); margin-top:6px; }
  .left-big small{ font-family:'Inter',sans-serif; font-size:11px; color:var(--text-faint); margin-right:6px; }
  .bar{ height:6px; background:var(--field); border-radius:999px; overflow:hidden; margin:14px 0 10px; }
  .bar i{ display:block; height:100%; background:linear-gradient(90deg, var(--gold-dim), var(--gold-bright)); border-radius:999px; }
  .inv-foot{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); }
  .inv-foot b{ font-family:'IBM Plex Mono',monospace; font-weight:500; color:var(--text); }
  .section-title{ font-size:13px; color:var(--text-dim); margin:22px 2px 10px; }
  .done-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid var(--line-soft); font-size:13.5px; }
  .done-row:first-child{ border-top:none; }
  .done-row .p{ font-family:'IBM Plex Mono',monospace; color:var(--good); font-size:13px; }
  .done-wrap{ background:linear-gradient(175deg, var(--card-2), var(--card)); border:1px solid var(--line-soft); border-radius:14px; padding:4px 18px; }

<body>

<div class="topbar">
  <button class="avatar-btn" id="avatarBtn" data-i18n-title="settingsTitle" data-i18n-aria="settingsTitle" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1.3-3.5 4.2-5.5 7.5-5.5s6.2 2 7.5 5.5"/></svg>
  </button>
  <span class="brand-mini">Saturn-Pay</span>
  <button class="bell-btn" id="bellBtn" data-i18n-title="notifications" data-i18n-aria="notifications" title="Notifications" aria-label="Notifications">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0 1 12 0c0 3.2 1 4.8 1.6 5.6.3.4 0 1-.5 1H4.9c-.5 0-.8-.6-.5-1C5 14.8 6 13.2 6 10Z"/><path d="M9.5 19a2.6 2.6 0 0 0 5 0"/></svg>
    <span class="bell-dot"></span>
  </button>
</div>

<main>
  <div class="page-head">
    <h1 data-i18n="pageTitle">Investment Plans</h1>
    <p data-i18n="pageDesc">Choose a plan, invest and receive your return when it ends.</p>
  </div>

  <div class="balance-strip">
    <div><div class="l" data-i18n="availableBalance">Available Balance</div><div class="v" id="balanceVal">$0.00</div></div>
    <a href="deposit.html" class="link-pill" data-i18n="depositLink">Deposit</a>
  </div>
  <p class="note" id="fastNote" style="display:none;" data-i18n="fastNote"></p>
  <p class="note" data-i18n="demoNote"></p>

  <div id="planList"></div>
</main>

<div class="overlay" id="sheetOverlay">
  <div class="sheet" role="dialog" aria-modal="true">
    <div id="sheetForm">
      <h2 id="sheetTitle"></h2>
      <label for="amountInput" data-i18n="amountLabel">Amount (USDT)</label>
      <input type="text" id="amountInput" inputmode="decimal" autocomplete="off" placeholder="0.00">
      <div class="hint" id="rangeHint"></div>
      <div class="preview">
        <div class="r"><span data-i18n="expectedProfit">Expected profit</span><b id="pvProfit">—</b></div>
        <div class="r"><span data-i18n="payoutTotal">Total payout</span><b id="pvPayout">—</b></div>
        <div class="r"><span data-i18n="endsOn">Ends on</span><b id="pvEnds">—</b></div>
      </div>
      <div class="err" id="sheetErr"></div>
      <button class="btn-gold" id="confirmBtn" data-i18n="confirmInvest">Confirm Investment</button>
      <button class="btn-ghost" id="cancelBtn" data-i18n="cancel">Cancel</button>
    </div>
    <div class="ok-box" id="sheetOk" style="display:none;">
      <div class="tick">✓</div>
      <p data-i18n="okInvested">Investment started!</p>
      <a href="invests.html" class="btn-gold" style="display:block;text-align:center;text-decoration:none;" data-i18n="viewInvests">View my active plans</a>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" class="nav-item">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V19a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V19a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V9.5"/></svg></span><span data-i18n="navHome">Home</span>
  </a>
  <a href="investments.html" class="nav-item active">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 9 11l4 4 8-8"/><path d="M14 6h7v7"/></svg></span><span data-i18n="navInvestments">Investments</span>
  </a>
  <a href="invests.html" class="nav-item">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg></span><span data-i18n="navInvests">Invests</span>
  </a>
  <a href="referral.html" class="nav-item">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M4 13h16"/><path d="M12 9v11"/><path d="M12 9c-1.2 0-3-1-3-2.6C9 5.1 10 4 11.3 4 12.7 4 12 7 12 9Z"/><path d="M12 9c1.2 0 3-1 3-2.6C15 5.1 14 4 12.7 4 11.3 4 12 7 12 9Z"/></svg></span><span data-i18n="navReferral">Referral</span>
  </a>
  <a href="assets.html" class="nav-item">
    <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.6"/></svg></span><span data-i18n="navAssets">Assets</span>
  </a>
</nav>

<script>
  const LANG_KEY = 'saturnpay_lang';
  const LOCALE_MAP = { en: 'en-US', tr: 'tr-TR', ru: 'ru-RU', es: 'es-ES', fr: 'fr-FR', de: 'de-DE' };

  const translations = {
  "en": {

    "notifications": "Notifications",
    "noNotifications": "You have no new notifications.",
    "navHome": "Home",
    "navInvestments": "Investments",

    "navReferral": "Referral",

  function getLang() { const c = localStorage.getItem(LANG_KEY) || 'en'; return translations[c] ? c : 'en'; }
  function t(key) { return (translations[getLang()] || translations.en)[key]; }
  function applyLang() {
    const code = getLang();
    const dict = translations[code] || translations.en;
    document.documentElement.lang = code;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      const key = el.getAttribute('data-i18n-title');
      if (dict[key] !== undefined) el.title = dict[key];
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => {
      const key = el.getAttribute('data-i18n-aria');
      if (dict[key] !== undefined) el.setAttribute('aria-label', dict[key]);
    });
    document.getElementById('pageTitleTag').textContent = `${dict.pageTitle} — Saturn-Pay`;
  }

  const TX_KEY = 'saturnpay_transactions';
  const INV_KEY = 'saturnpay_investments';
  function daysAgoISO(n) { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString(); }
  function makeId() { return 'tx_' + Math.random().toString(36).slice(2, 10); }
  function round2(n) { return Math.round(n * 100) / 100; }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function formatUSD(n) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n); }
  function formatDateLocalized(ms) {
    const locale = LOCALE_MAP[getLang()] || 'en-US';
    return new Date(ms).toLocaleDateString(locale, { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function formatDateTimeLocalized(ms) {
    const locale = LOCALE_MAP[getLang()] || 'en-US';
    return new Date(ms).toLocaleString(locale, { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function fmtLeft(ms) {
    if (ms <= 0) return '0' + t('unitS');
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    if (d > 0) return `${d}${t('unitD')} ${h}${t('unitH')}`;
    if (h > 0) return `${h}${t('unitH')} ${m}${t('unitM')}`;
    return `${m}${t('unitM')} ${sec}${t('unitS')}`;
  }

  function loadTransactions(user) {
    const raw = localStorage.getItem(TX_KEY);
    if (raw) {
      try { const p = JSON.parse(raw); if (Array.isArray(p)) return p; } catch (e) {}
    }
    let seed;
    if (typeof user.balance === 'number' && user.balance > 0) {
      seed = [{ id: makeId(), description: 'Initial balance', amount: user.balance, date: daysAgoISO(0) }];
    } else {
      seed = [
        { id: makeId(), description: 'USDT Deposit (TRC20)', amount: 250, date: daysAgoISO(14) },
        { id: makeId(), description: 'USDT Deposit (ERC20)', amount: 500, date: daysAgoISO(9) },
        { id: makeId(), description: 'USDT Withdrawal (TRC20)', amount: -120, date: daysAgoISO(2) },
      ];
    }
    localStorage.setItem(TX_KEY, JSON.stringify(seed));
    return seed;
  }
  function loadInvestments() {
    try { const a = JSON.parse(localStorage.getItem(INV_KEY) || '[]'); return Array.isArray(a) ? a : []; }
    catch (e) { return []; }
  }
  function saveInvestments(a) { localStorage.setItem(INV_KEY, JSON.stringify(a)); }
  // Credits principal + profit for plans whose end time has passed. Returns true if anything changed.
  function settleMatured() {
    if (window.SP && SP.live) return false; // server settles in live mode
    const invs = loadInvestments();
    let txs; try { txs = JSON.parse(localStorage.getItem(TX_KEY) || '[]'); } catch (e) { txs = []; }
    const now = Date.now();
    let changed = false;
    invs.forEach(inv => {
      if (!inv.settled && now >= inv.endTs) {
        inv.settled = true; changed = true;
        txs.push({ id: makeId(), description: 'Payout: ' + inv.name, amount: round2(inv.amount + inv.profit), date: new Date(inv.endTs).toISOString() });
      }
    });
    if (changed) { saveInvestments(invs); localStorage.setItem(TX_KEY, JSON.stringify(txs)); }
    return changed;
  }

  const token = localStorage.getItem('saturnpay_token');
  const userRaw = localStorage.getItem('saturnpay_user');
  if (!token) { window.location.href = 'login.html'; }
  let user = {};
  try { user = JSON.parse(userRaw || '{}'); } catch (e) { user = {}; }
  loadTransactions(user);
  settleMatured();

  document.getElementById('avatarBtn').addEventListener('click', () => window.location.href = 'settings.html');
  document.getElementById('bellBtn').addEventListener('click', () => alert(t('noNotifications')));

  // ── Plans (demo rates — edit these to change what is offered) ─────
  const PLANS = [
    { id: 'starter', name: 'Starter', days: 7,  daily: 0.8, min: 10,  max: 499 },
    { id: 'silver',  name: 'Silver',  days: 14, daily: 1.0, min: 100, max: 1999 },
    { id: 'gold',    name: 'Gold',    days: 30, daily: 1.2, min: 500, max: 10000 },
  ];
  const FAST = new URLSearchParams(location.search).get('fast') === '1';
  const DAY_MS = FAST ? 60000 : 86400000;
  if (FAST) document.getElementById('fastNote').style.display = 'block';

  function balance() {
    let txs; try { txs = JSON.parse(localStorage.getItem(TX_KEY) || '[]'); } catch (e) { txs = []; }
    return round2(txs.reduce((s, x) => s + x.amount, 0));
  }
  function totalPct(p) { return round2(p.daily * p.days); }

  function renderPlans() {
    document.getElementById('balanceVal').textContent = formatUSD(balance());
    document.getElementById('planList').innerHTML = PLANS.map(p => `
      <div class="plan-card">
        <div class="plan-head"><div class="plan-name">${escapeHtml(p.name)}</div><div class="plan-badge">+${totalPct(p)}%</div></div>
        <div class="plan-stats">
          <div><div class="k">${t('duration')}</div><div class="v">${p.days} ${t('daysUnit')}</div></div>
          <div><div class="k">${t('dailyReturn')}</div><div class="v">${p.daily}%</div></div>
          <div><div class="k">${t('minAmount')}</div><div class="v">${formatUSD(p.min)}</div></div>
        </div>
        <button class="btn-gold" data-plan="${p.id}">${t('btnInvest')}</button>
      </div>`).join('');
  }

  let activePlan = null;
  const overlay = document.getElementById('sheetOverlay');
  const amountInput = document.getElementById('amountInput');
  const errEl = document.getElementById('sheetErr');

  function parseAmount() {
    const v = parseFloat(amountInput.value.replace(',', '.'));
    return isFinite(v) ? round2(v) : NaN;
  }
  function updatePreview() {
    const a = parseAmount();
    if (!activePlan || !(a > 0)) {
      ['pvProfit', 'pvPayout', 'pvEnds'].forEach(id => document.getElementById(id).textContent = '—');
      return;
    }
    const profit = round2(a * activePlan.daily / 100 * activePlan.days);
    document.getElementById('pvProfit').textContent = '+' + formatUSD(profit);
    document.getElementById('pvPayout').textContent = formatUSD(a + profit);
    document.getElementById('pvEnds').textContent = formatDateTimeLocalized(Date.now() + activePlan.days * DAY_MS);
  }
  function openSheet(planId) {
    activePlan = PLANS.find(p => p.id === planId);
    document.getElementById('sheetTitle').textContent = activePlan.name;
    document.getElementById('rangeHint').textContent = `${t('minLabel')} ${formatUSD(activePlan.min)} · ${t('maxLabel')} ${formatUSD(activePlan.max)}`;
    amountInput.value = ''; errEl.textContent = '';
    document.getElementById('sheetForm').style.display = 'block';
    document.getElementById('sheetOk').style.display = 'none';
    updatePreview();
    overlay.classList.add('open');
    setTimeout(() => amountInput.focus(), 50);
  }
  function closeSheet() { overlay.classList.remove('open'); activePlan = null; renderPlans(); }

  document.getElementById('planList').addEventListener('click', e => {
    const b = e.target.closest('[data-plan]'); if (b) openSheet(b.dataset.plan);
  });
  amountInput.addEventListener('input', updatePreview);
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });

  document.getElementById('confirmBtn').addEventListener('click', () => {
    const a = parseAmount();
    if (!(a > 0)) { errEl.textContent = t('errInvalid'); return; }
    if (a < activePlan.min) { errEl.textContent = t('errMin'); return; }
    if (a > activePlan.max) { errEl.textContent = t('errMax'); return; }
    if (a > balance()) { errEl.textContent = t('errBalance'); return; }

    if (window.SP && SP.live) {
      const btn = document.getElementById('confirmBtn'); btn.disabled = true;
      SP.call('/api/invest', { planId: activePlan.id, amount: a }).then(() => {
        SP.sync();
        document.getElementById('sheetForm').style.display = 'none';
        document.getElementById('sheetOk').style.display = 'block';
        document.getElementById('balanceVal').textContent = formatUSD(balance());
      }).catch(err => { errEl.textContent = err.message; }).finally(() => { btn.disabled = false; });
      return;
    }

    const now = Date.now();
    const profit = round2(a * activePlan.daily / 100 * activePlan.days);
    const invs = loadInvestments();
    invs.push({
      id: 'inv_' + Math.random().toString(36).slice(2, 10),
      planId: activePlan.id, name: activePlan.name,
      amount: a, profit, daily: activePlan.daily, days: activePlan.days,
      startTs: now, endTs: now + activePlan.days * DAY_MS, settled: false,
    });
    saveInvestments(invs);
    let txs; try { txs = JSON.parse(localStorage.getItem(TX_KEY) || '[]'); } catch (e) { txs = []; }
    txs.push({ id: makeId(), description: 'Invested in ' + activePlan.name, amount: -a, date: new Date(now).toISOString() });
    localStorage.setItem(TX_KEY, JSON.stringify(txs));

    document.getElementById('sheetForm').style.display = 'none';
    document.getElementById('sheetOk').style.display = 'block';
    document.getElementById('balanceVal').textContent = formatUSD(balance());
  });

  applyLang();
  renderPlans();
</script>
